name: Test and Deploy

on:
  push:
    branches: '*'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install Poetry
      run: pip install poetry

    - name: Cache Poetry dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pypoetry
        key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-poetry-

    - name: Install dependencies
      run: poetry install --no-root

    - name: Run migrations
      env:
        DEBUG: "True"
        SECRET_KEY: ${{ secrets.SECRET_KEY || 'test-secret-key' }}
        NAME: test_db
        USER: test_user
        PASSWORD: test_password
        HOST: localhost
        PORT: 5432
        CELERY_BROKER_URL: redis://localhost:6379/0
        CELERY_RESULT_BACKEND: redis://localhost:6379/0
      run: |
        poetry run python manage.py migrate

    - name: Run tests
      env:
        DEBUG: "True"
        SECRET_KEY: ${{ secrets.SECRET_KEY || 'test-secret-key' }}
        NAME: test_db
        USER: test_user
        PASSWORD: test_password
        HOST: localhost
        PORT: 5432
        STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY || 'test-key' }}
        EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
        CELERY_BROKER_URL: redis://localhost:6379/0
        CELERY_RESULT_BACKEND: redis://localhost:6379/0
      run: |
        poetry run python manage.py test --noinput

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo " Deploying to server..."
            cd /home/kandr/online_learning_platform
            git pull origin ${{ github.ref_name }}
            sudo systemctl restart online-learning.service
            echo "Deployment completed!"
